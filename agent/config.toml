# 模型配置
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
model_reasoning_summary = "detailed"
model_verbosity = "low"
service_tier = "fast"
personality = "pragmatic"

# 安全设置
sandbox_mode = "danger-full-access"
approval_policy = "never"

# 终端界面配置
[tui]
notifications = true
notification_condition = "unfocused"
